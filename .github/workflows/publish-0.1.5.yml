name: Publish Dr. Corrosion 0.1.5

on:
  workflow_dispatch:
  push:
    branches: [publish-0.1.5]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  VERSION: 0.1.5
  PRIVATE_SOURCE_REPO: DomnSpace/Dr.-Corrosion
  PRIVATE_SOURCE_SHA: af7b87bfb50943b77ce0cdbc59516a0fcf3131a9
  FUNCTIONAL_SHA: 03bbc5d2aa19c30e2cce551bab8ae8ac122dd2dd
  ARKADEON_SHA: 00baa4e0ac0aaafe70f711863beffaed02382427
  AUDIO_STAGE_REF: release-015-sealed-audio
  AUDIO_STAGE_ZIP: release-inputs/dr-corrosion-runtime-audio-0.1.5.zip
  AUDIO_STAGE_ZIP_SHA256: e20dfed98177f4f8397bfa490e5bc24673d95c46f1b89989f636917a702aa596
  PUBLIC_BASE: https://domnspace.github.io/Dr-Corrosion
  R04_URL: https://domandsupply.com/dr-corrosion/assets/04/9f2c7e1d.pack
  R17_URL: https://domandsupply.com/dr-corrosion/assets/17/c84031a6.pack

concurrency:
  group: dr-corrosion-public-0.1.5
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require private-source read token
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN"

      - name: Checkout pinned private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SOURCE_REPO }}
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout sealed private runtime audio staging
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SOURCE_REPO }}
          ref: ${{ env.AUDIO_STAGE_REF }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: audio-stage
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned source and release-only delta
        shell: bash
        run: |
          set -euo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          git merge-base --is-ancestor "$FUNCTIONAL_SHA" "$PRIVATE_SOURCE_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$FUNCTIONAL_SHA" "$PRIVATE_SOURCE_SHA")
          for path in "${CHANGED[@]}"; do
            case "$path" in
              docs/RELEASE_NOTES_0.1.5.md|packaging/arkadeon_cartridge.json|packaging/build_manifest.json|tests/test_theme_runtime_reproduction.py|tests/test_release_candidate.py|tools/reproduce_theme_runtime_audio.py) ;;
              *) echo "Unexpected post-acceptance source change: $path"; exit 1 ;;
            esac
          done

      - name: Install release validation dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy netCDF4 pillow

      - name: Validate private release source
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python -m compileall -q dr_corrosion.py surge_spool.py dr_music.py research_harvester.py gameboy_art.py lab_rooms.py labgraph experimental_lab dr_runtime dr_soundtrack tests
          python -m py_compile tools/stage_theme_runtime_audio.py tools/reproduce_theme_runtime_audio.py tools/build_music_ready_release.py
          node --check music/dr_corrosion.strudel.js
          node --check music/demo/music-readiness-015-pass8.js
          python -m pytest -q
          node --test tests/test_feedback.cjs
          python -m dr_runtime.fresh_player --fresh-player-acceptance
          python -m dr_runtime.release_acceptance
          python tools/release_performance_smoke.py
          python -m labgraph validate
          python -m experimental_lab validate
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
          python -m labgraph native-check

      - name: Verify deployed Arkadeon shell
        run: cd source && python tools/check_hosted_arkadeon_shell.py

      - name: Materialize authenticated R04 release seed
        run: cd source && python tools/materialize_release_seed.py --r04-url "$R04_URL"

      - name: Verify canonical hosted R17
        run: cd source && python tools/check_hosted_r17.py "$R17_URL" --origin https://domnspace.github.io

      - name: Materialize exact sealed runtime audio
        shell: bash
        run: |
          set -euo pipefail
          ZIP="audio-stage/$AUDIO_STAGE_ZIP"
          test -f "$ZIP"
          echo "$AUDIO_STAGE_ZIP_SHA256  $ZIP" | sha256sum -c -

          rm -rf source/.release-audio
          mkdir -p source/.release-audio
          unzip -q "$ZIP" -d source/.release-audio

          M4A=source/.release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.m4a
          OPUS=source/.release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.opus
          test "$(stat -c %s "$M4A")" = 6902360
          test "$(stat -c %s "$OPUS")" = 5292011
          echo '68e4497d20814b9c7be5e39c3d0052e6776e22d987dd42ba23878212284c0449  source/.release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.m4a' | sha256sum -c -
          echo '78f309b27ecc0d60c07970744df16c6046f952ea55571eff7661b7c198326746  source/.release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.opus' | sha256sum -c -
          test "$(( $(stat -c %s "$M4A") + $(stat -c %s "$OPUS") ))" = 12194371

      - name: Build and reverify stable music-ready cartridge
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python tools/build_music_ready_release.py \
            --version "$VERSION" \
            --channel stable \
            --output-dir dist-stable \
            --index-url "$PUBLIC_BASE/stable/cartridge-index.json" \
            --cartridge-url "$PUBLIC_BASE/stable/dr-corrosion.drc" \
            --r17-url "$R17_URL" \
            --r17-metadata-only \
            --theme-audio .release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.m4a \
            --theme-audio .release-audio/dr-corrosion-alles-im-gruenen-bereich-0.1.5.opus

          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          from tools.build_music_ready_release import verify_packaged_audio

          root = Path('dist-stable')
          drc = root / f"dr-corrosion-{os.environ['VERSION']}.drc"
          verified = verify_packaged_audio(drc)
          assert sum(int(row['bytes']) for row in verified) == 12_194_371
          with zipfile.ZipFile(drc, 'r') as archive:
              assert not any(name.lower().endswith('.wav') for name in archive.namelist())
              assert json.loads(archive.read('cartridge.json'))['version'] == os.environ['VERSION']

          info_path = root / 'build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info.update(
              source_commit=os.environ['PRIVATE_SOURCE_SHA'],
              functional_base_commit=os.environ['FUNCTIONAL_SHA'],
              arkadeon_host_commit=os.environ['ARKADEON_SHA'],
              distribution_repository=os.environ['GITHUB_REPOSITORY'],
              distribution_commit=os.environ['GITHUB_SHA'],
              promotion='public-stable-music-readiness',
              public_base=os.environ['PUBLIC_BASE'],
              runtime_audio_source='sealed-private-release-input',
              runtime_audio_bytes_required=12194371,
          )
          info_path.write_text(json.dumps(info, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Stage public-only distribution files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets public
          mkdir -p release-assets public/stable
          cp "source/dist-stable/dr-corrosion-$VERSION.drc" release-assets/dr-corrosion.drc
          cp source/dist-stable/cartridge-index.json release-assets/cartridge-index.json
          cp source/dist-stable/build-info.json release-assets/build-info.json
          cp RELEASE_NOTES_0.1.5.md release-assets/RELEASE_NOTES_0.1.5.md
          cp site/index.html public/index.html
          cp RELEASE_NOTES_0.1.5.md public/RELEASE_NOTES_0.1.5.md
          cp release-assets/dr-corrosion.drc public/stable/dr-corrosion.drc
          cp release-assets/cartridge-index.json public/stable/cartridge-index.json
          cp release-assets/build-info.json public/stable/build-info.json
          touch public/.nojekyll

      - name: Publish or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="dr-corrosion-stable-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf .existing-release && mkdir .existing-release
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .existing-release
            for name in dr-corrosion.drc cartridge-index.json build-info.json RELEASE_NOTES_0.1.5.md; do
              cmp "release-assets/$name" ".existing-release/$name"
            done
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dr. Corrosion $VERSION — Music-ready Level-1 demo" \
              --notes-file RELEASE_NOTES_0.1.5.md \
              release-assets/dr-corrosion.drc \
              release-assets/cartridge-index.json \
              release-assets/build-info.json \
              release-assets/RELEASE_NOTES_0.1.5.md
          fi

      - name: Configure public Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public install surface
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-publish
    steps:
      - name: Deploy public install page and stable cartridge
        id: deployment
        uses: actions/deploy-pages@v4
